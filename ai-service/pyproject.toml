[project]
name = "courtly-ai"
version = "0.1.0"
description = "AI service cua Courtly: huan luyen va suy luan CatBoostRanker xep hang doi tac, model can bang doi"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
