spring:
  application:
    name: courtly-backend

  # Cau hinh bi mat (mat khau SMTP...) de o backend/.env, khong commit.
  # Thieu file cung khong sao: ung dung van chay, chi la khong gui duoc mail.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/courtly}
    username: ${DB_USERNAME:courtly}
    password: ${DB_PASSWORD:courtly}
    hikari:
      pool-name: courtly-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quan ly. Hibernate chi kiem tra entity co khop schema khong.
      ddl-auto: validate
    properties:
      hibernate:
        # Khong dat hibernate.jdbc.time_zone: thuoc tinh nay ap ca len cot `time`
        # va lam lech gia tri LocalTime (gio mo cua, khung gio ranh).
        # Cac cot timestamptz deu map bang Instant nen luon duoc ghi theo UTC.
        format_sql: false
        default_schema: public
        # Gop nhieu INSERT vao mot lan gui xuong database. Can cho seeder BWF:
        # 26.000 dong ma gui tung cau thi mat hang phut. Dung duoc vi moi entity
        # deu tu sinh UUID o tang ung dung, khong doi database tra ve id.
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Khong de luong gui mail treo lau hon thoi gian song cua ma xac minh.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      # 2.3.6 - anh san toi da 5MB; de du cho caption va phan dau multipart.
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when_authorized

courtly:
  partner-requests:
    # Thoi gian cho nguoi nhan phan hoi, qua han thi yeu cau tu het han (phut).
    expiry-minutes: ${PARTNER_REQUEST_EXPIRY_MINUTES:60}
  reviews:
    # So ngay sau khi don hoan thanh nguoi choi con duoc viet danh gia san (2.3.77).
    window-days: ${VENUE_REVIEW_WINDOW_DAYS:7}
  disputes:
    # Nguoi choi chi bao cao duoc don trong so ngay nay ke tu gio ket thuc (2.3.85).
    report-window-days: ${BOOKING_DISPUTE_WINDOW_DAYS:7}
    # Han chu san giai trinh ke tu luc tao bao cao.
    owner-response-hours: ${BOOKING_DISPUTE_OWNER_RESPONSE_HOURS:48}
  matching:
    # Nguong canh bao chat luong ghep cap tren man hinh quan tri (2.3.73).
    quality:
      min-acceptance-rate: ${MATCHING_MIN_ACCEPTANCE_RATE:20.0}
      max-failure-rate: ${MATCHING_MAX_FAILURE_RATE:5.0}
      max-model-age-days: ${MATCHING_MAX_MODEL_AGE_DAYS:90}
      max-p95-ms: ${MATCHING_MAX_P95_MS:1500}
  seed:
    # Bat seeder du lieu mau: SEED_ENABLED=true, hoac chay voi profile dev
    enabled: ${SEED_ENABLED:false}
  jobs:
    booking-expiry:
      # Het han yeu cau/checkout va hoan tat booking sau gio choi.
      enabled: ${BOOKING_EXPIRY_JOB_ENABLED:true}
      interval-ms: 60000
    owner-restriction:
      # Tinh lai muc han che chu san co cong no hoa hong qua han (B2).
      enabled: ${OWNER_RESTRICTION_JOB_ENABLED:true}
      initial-delay-ms: 60000
      interval-ms: ${OWNER_RESTRICTION_JOB_INTERVAL_MS:300000}
    partner-request-expiry:
      # Tu huy yeu cau ghep cap qua han phan hoi.
      enabled: ${PARTNER_REQUEST_EXPIRY_JOB_ENABLED:true}
      initial-delay-ms: 30000
      interval-ms: ${PARTNER_REQUEST_EXPIRY_JOB_INTERVAL_MS:60000}
    reminders:
      # Nhac lich choi (2.3.59) va nhac xac nhan ket qua tran dau (2.3.60).
      enabled: ${REMINDER_JOB_ENABLED:true}
      initial-delay-ms: 120000
      interval-ms: ${REMINDER_JOB_INTERVAL_MS:300000}
    match-data:
      enabled: ${MATCH_DATA_JOB_ENABLED:true}
      confirmation-interval-ms: ${MATCH_CONFIRMATION_JOB_INTERVAL_MS:3600000}
      reconciliation-cron: ${MATCH_STATISTICS_RECONCILIATION_CRON:0 20 2 * * *}
  mail:
    # false = khong goi SMTP, chi ghi ma ra log. Dung khi chay test hoac chua co .env
    enabled: ${MAIL_ENABLED:false}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@courtly.vn}
    from-name: ${MAIL_FROM_NAME:Courtly}
  auth:
    email-verification:
      # 2.1.1 - xac minh email khi dang ky
      code-ttl-minutes: 15
      max-attempts: 5
      resend-cooldown-seconds: 60
      max-sends-per-hour: 5
    password-reset:
      # 2.1.5 - cac nguong nay la mot phan cua hop dong API, frontend hien thi lai cho nguoi dung
      code-ttl-minutes: 10
      token-ttl-minutes: 10
      max-attempts: 5
      resend-cooldown-seconds: 60
      max-sends-per-hour: 5
  storage:
    # 2.3.6 - thu muc luu anh san tai len. Production: dat ngoai thu muc deploy.
    upload-dir: ${UPLOAD_DIR:uploads}
    # Goc URL cong khai cua backend, dung de dung duong dan anh tra cho frontend.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt:
      # BAT BUOC doi o moi truong that. Toi thieu 32 ky tu cho HS256.
      secret: ${JWT_SECRET:courtly-dev-secret-key-doi-lai-truoc-khi-len-that-0123456789}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
      issuer: courtly
    cors:
      # Frontend Vite chay o cong 5173
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.courtly: DEBUG
    org.flywaydb: INFO
